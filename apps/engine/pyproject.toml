[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regime-aware-systematic-equities"
version = "0.1.0"
description = "Regime-aware multi-strategy systematic equities research platform."
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Arnaav Raj" }
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "statsmodels>=0.14",
    "hmmlearn>=0.3",
    "matplotlib>=3.7",
    "plotly>=5.15",
    "cvxpy>=1.3",
    "yfinance>=0.2",
    "backtesting>=0.3.3",
    "PyYAML>=6.0",
    "fastapi>=0.115,<1",
    "pydantic>=2.7,<3",
    "uvicorn>=0.30,<1",
    "ziglang==0.13.0",
    "optuna==4.5.0",
    "threadpoolctl>=3.6"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.27,<1",
    "ruff>=0.4",
    "mypy>=1.8",
    "black>=24.0",
    "jupyter>=1.0"
]

[tool.setuptools.packages.find]
include = [
    "analytics*",
    "apps",
    "backtesting*",
    "configs*",
    "data*",
    "execution*",
    "portfolio*",
    "regime_detection*",
    "research*",
    "qresearch*",
    "risk*",
    "strategies*",
    "visualization*"
]

[tool.setuptools.package-data]
qresearch = ["source-manifest.json", "cpp/*.cpp", "cpp/*.hpp"]

[tool.pytest.ini_options]
testpaths = ["tests", "evidence_tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider --import-mode=importlib --ignore=evidence_tests/test_app.py"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
no_site_packages = true
warn_unused_ignores = true
warn_redundant_casts = true
